name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore
        working-directory: backend

      - name: Test
        run: dotnet test --no-build --verbosity normal
        working-directory: backend

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: acrownyoursheet.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t acrownyoursheet.azurecr.io/ownyoursheet:${{ github.sha }} -t acrownyoursheet.azurecr.io/ownyoursheet:latest .
          docker push acrownyoursheet.azurecr.io/ownyoursheet:${{ github.sha }}
          docker push acrownyoursheet.azurecr.io/ownyoursheet:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: rg-ownyoursheet
          containerAppName: ownyoursheet
          imageToDeploy: acrownyoursheet.azurecr.io/ownyoursheet:${{ github.sha }}
